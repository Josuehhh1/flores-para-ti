<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flores para ti 💜</title>
<style>
body {
  background: #10051f;
  color: #e9c5ff;
  text-align: center;
  font-family: Arial, sans-serif;
  padding: 30px 10px;
}
.flor {
  font-size: 65px;
  animation: flotar 2s infinite alternate;
  display: inline-block;
  margin: 8px;
}
h1 { font-size: 24px; }
p { color: white; font-size: 19px; }
@keyframes flotar {
  to { transform: translateY(-12px) rotate(8deg); }
}
</style>
</head>
<body>
<h1>💜 FELIZ DÍA DE LAS FLORES MORADAS 💜</h1>
<div>
  <span class="flor">🌷</span>
  <span class="flor">🪻</span>
  <span class="flor">🌷</span>
  <br>
  <span class="flor">🪻</span>
  <span class="flor">🌷</span>
  <span class="flor">🪻</span>
</div>
<p>Perdón por decírtelo tarde...</p>
<p>Hice estas flores pensando en ti 💜</p>
</body>
</html>
